# Close linked issues when a PR merges into a branch other than main.
#
# GitHub only acts on "Closes #N" when a PR merges into the DEFAULT branch
# (main here). Our Gitflow merges feature work into develop, so before this
# workflow every story and task stayed open after its PR merged, and the board
# never moved it to Done. Found Nov 3, 2026: #49, #50, #51, #54, #55, #58, #63
# and #65 were all still open with merged PRs. Tracked in #82.
#
# Uses only the automatic GITHUB_TOKEN (issues: write). Closing the issue fires
# the project board's built in "Item closed -> Done" workflow.
name: Close linked issues

on:
  pull_request:
    types: [closed]                      # fires on merge and on plain close
    branches: [develop, "release/**", "hotfix/**"]  # main already closes issues natively

permissions:
  issues: write                          # needed to comment on and close issues
  pull-requests: read                    # needed to read the PR body

jobs:
  close_linked:
    name: Close issues named by Closes/Fixes/Resolves
    if: github.event.pull_request.merged == true   # skip PRs closed without merging
    runs-on: ubuntu-latest
    steps:
      - name: Close each linked issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}            # token for the gh cli
          REPO: ${{ github.repository }}                    # owner/name of this repo
          PR_NUMBER: ${{ github.event.pull_request.number }} # the merged PR
          PR_BODY: ${{ github.event.pull_request.body }}     # body holding Closes #N
          BASE_REF: ${{ github.event.pull_request.base.ref }} # branch it merged into
        run: |
          # collect every issue number that follows a closing keyword
          issue_numbers=$(printf '%s' "$PR_BODY" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]:]*#[0-9]+' \
            | grep -oE '[0-9]+' | sort -un)
          # stop quietly when the PR names no issue
          if [ -z "$issue_numbers" ]; then
            echo "::notice::PR #$PR_NUMBER names no issue to close"; exit 0
          fi
          # close each named issue that is still open
          for issue_number in $issue_numbers; do
            # read the issue state; skip numbers that are PRs or do not exist
            issue_state=$(gh api "repos/$REPO/issues/$issue_number" \
              --jq 'if .pull_request then "pr" else .state end' 2>/dev/null || echo missing)
            if [ "$issue_state" != "open" ]; then
              echo "::notice::#$issue_number is $issue_state, nothing to do"; continue
            fi
            # leave a trail on the issue, then close it as completed
            gh api "repos/$REPO/issues/$issue_number/comments" \
              -f body="Closed by #$PR_NUMBER, merged into \`$BASE_REF\`." > /dev/null
            gh api -X PATCH "repos/$REPO/issues/$issue_number" \
              -f state=closed -f state_reason=completed > /dev/null
            echo "::notice::closed #$issue_number (merged in #$PR_NUMBER)"
          done
