# pytest settings for the prototype; CI runs `python -m pytest -q` from prototype/.
[pytest]
# Put src/ on the import path so tests can import config, database, services and app.
pythonpath = src
# Only collect tests from the tests folder.
testpaths = tests
# Register the marker used by tests that need live Snowflake credentials.
markers =
    snowflake: needs live SonarX Snowflake credentials; skipped when they are not set
